name: Release integration

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build installation ZIP
        run: zip -r universal_llm_assist.zip custom_components/universal_llm_assist -x '*/__pycache__/*' '*.pyc'
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" universal_llm_assist.zip --generate-notes
